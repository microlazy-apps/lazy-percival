application:
  subdomain: percival
  upstreams:
    - location: /
      backend: http://main:8080
  public_path:
    - /
  health_check:
    test_url: http://main:8080/health
    timeout: 10s
    start_period: 5s

services:
  main:
    image: ${LAZYCAT_IMAGE}
    environment:
      - LISTEN_ADDR=:8080
      - ENABLE_GIST_API=false
      - TZ=Asia/Shanghai
